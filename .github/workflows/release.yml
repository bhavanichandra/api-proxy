name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    
    - name: Build executables for all platforms
      run: |
        mkdir -p dist
        bun build src/app.js --compile --target bun-linux-x64 --outfile dist/api-proxy-linux-x64
        bun build src/app.js --compile --target bun-windows-x64 --outfile dist/api-proxy-windows-x64.exe
        bun build src/app.js --compile --target bun-darwin-x64 --outfile dist/api-proxy-macos-x64
        bun build src/app.js --compile --target bun-darwin-arm64 --outfile dist/api-proxy-macos-arm64
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-proxy-executables
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-proxy-executables
        path: dist
        
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist/*
